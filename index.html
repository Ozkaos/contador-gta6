<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GTA VI Countdown</title>


<style>

/* =========================================
   FONDO TRANSPARENTE
========================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent !important;

    overflow: hidden;

}


/* =========================================
   CONTENEDOR PRINCIPAL
========================================= */

.contador {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    width: max-content;

    padding: 8px 15px;

    background: transparent !important;

    border: none;

    box-shadow: none;

}


/* =========================================
   GTA VI
========================================= */

.titulo {

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 42px;

    font-weight: 900;

    line-height: 1;

    letter-spacing: 1px;

    color: #ffffff;

    -webkit-text-stroke: 2px #000000;

    text-shadow:

        2px 2px 0 #000000,

        4px 4px 0 #000000;

}


/* =========================================
   CONTADOR
========================================= */

.tiempo {

    margin-top: 10px;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 44px;

    font-weight: 900;

    line-height: 1;

    letter-spacing: 2px;

    color: #ffffff;

    -webkit-text-stroke: 2px #000000;

    text-shadow:

        2px 2px 0 #000000,

        4px 4px 0 #000000;

    white-space: nowrap;

}


/* =========================================
   PARA EL LANZAMIENTO
========================================= */

.etiqueta {

    margin-top: 10px;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 17px;

    font-weight: 900;

    line-height: 1;

    letter-spacing: 1px;

    color: #ffffff;

    -webkit-text-stroke: 1px #000000;

    text-shadow:

        2px 2px 0 #000000;

}


/* =========================================
   MENSAJE FINAL
========================================= */

.final {

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 38px;

    color: #ffffff;

    -webkit-text-stroke: 2px #000000;

    text-shadow:

        3px 3px 0 #000000;

}

</style>

</head>


<body>


<div class="contador">


    <div class="titulo">
        GTA VI
    </div>


    <div
        class="tiempo"
        id="tiempo">

        Cargando...

    </div>


    <div class="etiqueta">
        PARA EL LANZAMIENTO
    </div>


</div>


<script>


/* =========================================
   FECHA DEL LANZAMIENTO
========================================= */

const fechaObjetivo =
    new Date("2026-11-19T00:00:00");


/* =========================================
   ACTUALIZAR CONTADOR
========================================= */

function actualizarContador() {


    const ahora =
        new Date();


    const diferencia =
        fechaObjetivo - ahora;


    /* =====================================
       SI YA LLEGÓ EL LANZAMIENTO
    ===================================== */

    if (diferencia <= 0) {


        const elemento =
            document.getElementById("tiempo");


        elemento.className =
            "tiempo final";


        elemento.innerHTML =
            "¡GTA VI YA ESTÁ AQUÍ!";


        return;

    }


    /* =====================================
       DÍAS
    ===================================== */

    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    /* =====================================
       HORAS
    ===================================== */

    const horas =
        Math.floor(
            (diferencia /
            (1000 * 60 * 60)) % 24
        );


    /* =====================================
       MINUTOS
    ===================================== */

    const minutos =
        Math.floor(
            (diferencia /
            (1000 * 60)) % 60
        );


    /* =====================================
       SEGUNDOS
    ===================================== */

    const segundos =
        Math.floor(
            (diferencia / 1000) % 60
        );


    /* =====================================
       MOSTRAR CONTADOR
    ===================================== */

    document.getElementById("tiempo").innerHTML =

        `${dias}D ` +

        `${horas
            .toString()
            .padStart(2, "0")}H ` +

        `${minutos
            .toString()
            .padStart(2, "0")}M ` +

        `${segundos
            .toString()
            .padStart(2, "0")}S`;

}


/* =========================================
   INICIAR
========================================= */

actualizarContador();


/* =========================================
   ACTUALIZAR CADA SEGUNDO
========================================= */

setInterval(
    actualizarContador,
    1000
);


</script>


</body>

</html>
