<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cuenta regresiva GTA VI</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Rye&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        body {
            font-family: 'Rye', Georgia, serif;
            color: white;
        }

        .contador {

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: center;

            gap: 28px;

            padding: 10px 30px;

            background: transparent;

            white-space: nowrap;

        }

        .titulo {

            font-size: 38px;

            font-weight: normal;

            color: white;

            -webkit-text-stroke: 2px black;

            text-shadow:
                3px 3px 0 black,
                5px 5px 8px rgba(0,0,0,0.8);

        }

        .tiempo {

            font-family: 'Rye', Georgia, serif;

            font-size: 42px;

            font-weight: normal;

            letter-spacing: 2px;

            color: white;

            -webkit-text-stroke: 2px black;

            text-shadow:
                3px 3px 0 black,
                5px 5px 8px rgba(0,0,0,0.8);

        }

        .etiqueta {

            font-size: 18px;

            color: white;

            -webkit-text-stroke: 1px black;

            text-shadow:
                2px 2px 0 black,
                3px 3px 6px rgba(0,0,0,0.8);

        }

    </style>

</head>

<body>

<div class="contador">

    <div class="titulo">
        GTA VI
    </div>

    <div class="tiempo" id="tiempo">
        Cargando...
    </div>

    <div class="etiqueta">
        PARA EL LANZAMIENTO
    </div>

</div>

<script>

    // FECHA OBJETIVO
    const fechaObjetivo = new Date("2026-11-19T00:00:00");

    function actualizarContador() {

        const ahora = new Date();

        const diferencia = fechaObjetivo - ahora;

        if (diferencia <= 0) {

            document.getElementById("tiempo").innerHTML =
                "¡GTA VI YA ESTÁ AQUÍ!";

            return;
        }

        const dias = Math.floor(
            diferencia / (1000 * 60 * 60 * 24)
        );

        const horas = Math.floor(
            (diferencia / (1000 * 60 * 60)) % 24
        );

        const minutos = Math.floor(
            (diferencia / (1000 * 60)) % 60
        );

        const segundos = Math.floor(
            (diferencia / 1000) % 60
        );

        document.getElementById("tiempo").innerHTML =
            `${dias}D ${horas.toString().padStart(2, "0")}H ${minutos.toString().padStart(2, "0")}M ${segundos.toString().padStart(2, "0")}S`;
    }

    actualizarContador();

    setInterval(actualizarContador, 1000);

</script>

</body>
</html>
