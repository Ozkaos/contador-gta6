<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GTA VI Countdown</title>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
        }

        body {
            font-family: Impact, "Arial Black", Arial, sans-serif;
            color: white;
        }

        /*
        CONTENEDOR PRINCIPAL
        TOTALMENTE TRANSPARENTE
        */

        .contador {

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: center;

            gap: 30px;

            width: max-content;

            padding: 8px 20px;

            background: transparent !important;

            border: none;

            box-shadow: none;

            white-space: nowrap;

        }


        /*
        TITULO GTA VI
        */

        .titulo {

            font-family: Impact, "Arial Black", sans-serif;

            font-size: 42px;

            font-weight: 900;

            color: #ffffff;

            letter-spacing: 1px;

            -webkit-text-stroke: 2px #000000;

            text-shadow:
                3px 3px 0 #000000,
                5px 5px 0 rgba(0,0,0,0.65);

        }


        /*
        CONTADOR
        BLANCO PURO
        */

        .tiempo {

            font-family: Impact, "Arial Black", sans-serif;

            font-size: 46px;

            font-weight: 900;

            letter-spacing: 3px;

            color: #ffffff;

            -webkit-text-stroke: 2px #000000;

            text-shadow:
                3px 3px 0 #000000,
                5px 5px 0 rgba(0,0,0,0.65);

        }


        /*
        TEXTO INFORMATIVO
        */

        .etiqueta {

            font-family: Impact, "Arial Black", sans-serif;

            font-size: 19px;

            font-weight: 900;

            letter-spacing: 1px;

            color: #ff4fa3;

            -webkit-text-stroke: 1px #000000;

            text-shadow:
                2px 2px 0 #000000,
                3px 3px 0 rgba(0,0,0,0.6);

        }


    </style>

</head>


<body>


<div class="contador">


    <div class="titulo">
        GTA VI
    </div>


    <div class="tiempo" id="tiempo">
        Cargando...
    </div>


    <div class="etiqueta">
        PARA EL LANZAMIENTO
    </div>


</div>


<script>


    /*
    =====================================================
    FECHA OBJETIVO
    =====================================================
    */

    const fechaObjetivo = new Date("2026-11-19T00:00:00");


    /*
    =====================================================
    ACTUALIZAR CONTADOR
    =====================================================
    */

    function actualizarContador() {

        const ahora = new Date();

        const diferencia = fechaObjetivo - ahora;


        /*
        SI LLEGAMOS A LA FECHA
        */

        if (diferencia <= 0) {

            document.getElementById("tiempo").innerHTML =
                "¡GTA VI YA ESTÁ AQUÍ!";

            return;

        }


        /*
        CALCULAR DÍAS
        */

        const dias = Math.floor(
            diferencia / (1000 * 60 * 60 * 24)
        );


        /*
        CALCULAR HORAS
        */

        const horas = Math.floor(
            (diferencia / (1000 * 60 * 60)) % 24
        );


        /*
        CALCULAR MINUTOS
        */

        const minutos = Math.floor(
            (diferencia / (1000 * 60)) % 60
        );


        /*
        CALCULAR SEGUNDOS
        */

        const segundos = Math.floor(
            (diferencia / 1000) % 60
        );


        /*
        MOSTRAR CONTADOR
        */

        document.getElementById("tiempo").innerHTML =

            `${dias}D ${horas.toString().padStart(2, "0")}H ${minutos.toString().padStart(2, "0")}M ${segundos.toString().padStart(2, "0")}S`;

    }


    /*
    ACTUALIZAR INMEDIATAMENTE
    */

    actualizarContador();


    /*
    ACTUALIZAR CADA SEGUNDO
    */

    setInterval(actualizarContador, 1000);


</script>


</body>
</html>
