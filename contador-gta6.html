
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cuenta regresiva GTA VI</title>

    <style>
        body {
            margin: 0;
            background: transparent;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .contador {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.75);
        }

        .titulo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tiempo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .etiqueta {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
    </style>
</head>

<body>

<div class="contador">

    <div class="titulo">
        GTA VI
    </div>

    <div class="tiempo" id="tiempo">
        Cargando...
    </div>

    <div class="etiqueta">
        PARA EL LANZAMIENTO
    </div>

</div>

<script>

    // FECHA OBJETIVO
    const fechaObjetivo = new Date("2026-11-19T00:00:00");

    function actualizarContador() {

        const ahora = new Date();

        const diferencia = fechaObjetivo - ahora;

        if (diferencia <= 0) {

            document.getElementById("tiempo").innerHTML =
                "¡GTA VI YA ESTÁ AQUÍ!";

            return;
        }

        const dias = Math.floor(
            diferencia / (1000 * 60 * 60 * 24)
        );

        const horas = Math.floor(
            (diferencia / (1000 * 60 * 60)) % 24
        );

        const minutos = Math.floor(
            (diferencia / (1000 * 60)) % 60
        );

        const segundos = Math.floor(
            (diferencia / 1000) % 60
        );

        document.getElementById("tiempo").innerHTML =
            `${dias}D ${horas.toString().padStart(2, "0")}H ${minutos.toString().padStart(2, "0")}M ${segundos.toString().padStart(2, "0")}S`;
    }

    actualizarContador();

    setInterval(actualizarContador, 1000);

</script>

</body>
</html>
